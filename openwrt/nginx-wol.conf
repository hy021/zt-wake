# nginx 片段：把 /cgi-bin/wol 反代到本机 9999 的 socat 端点
# 放到 server { } 块里（LuCI 的 /cgi-bin/luci 是另一条精确匹配，不受影响）
# 改完 nginx -t && service nginx reload

location = /cgi-bin/wol {
    proxy_pass http://127.0.0.1:9999/wol?$args;
    proxy_http_version 1.0;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    access_log off;
}
